services:
  - type: web
    name: school-transport
    runtime: python
    plan: free
    rootDir: school_transport
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: school-notifications
    runtime: python
    plan: free
    rootDir: notifications
    buildCommand: pip install -r requirements.txt
    startCommand: python app.py
    healthCheckPath: /login
    envVars:
      - key: SECRET_KEY
        generateValue: true

  - type: web
    name: school-academics
    runtime: node
    plan: free
    rootDir: academics/backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /

  - type: web
    name: school-fee-api
    runtime: node
    plan: free
    rootDir: fee finance/backend
    buildCommand: npm install && npm run prisma:generate && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        sync: false

  - type: web
    name: school-fee-frontend
    runtime: static
    plan: free
    rootDir: fee finance/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false