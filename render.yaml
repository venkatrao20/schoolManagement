services:
  - type: web
    name: school-fee-frontend
    runtime: static
    rootDir: fee finance/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_DEMO_MODE
        value: "true"