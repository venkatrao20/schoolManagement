{% extends 'base.html' %}
{% block content %}
<div class="page-header">
    <div>
        <p class="eyebrow">{{ user.role|title }}</p>
        <h1>Notifications</h1>
    </div>
</div>

<div class="table-card">
    <table>
        <thead>
            <tr>
                <th>Student</th>
                <th>Message</th>
                <th>Date</th>
            </tr>
        </thead>
        <tbody>
            {% for item in notifications %}
            <tr>
                <td>{{ item.student_name }}</td>
                <td>{{ item.message }}</td>
                <td>{{ item.created_at }}</td>
            </tr>
            {% else %}
            <tr><td colspan="3">No notifications available.</td></tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
