{% extends 'base.html' %}

{% block title %}Page Not Found - SchoolSafe{% endblock %}

{% block content %}
<style>
    .error-container {
        max-width: 600px;
        margin: 60px auto;
        text-align: center;
    }
    .error-card {
        background: #FFFDF8;
        border-radius: 14px;
        padding: 40px 30px;
        box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
    }
    .error-code {
        font-size: 5rem;
        font-weight: 700;
        color: #B8863B;
        margin-bottom: 16px;
    }
    .error-title {
        font-size: 1.8rem;
        font-weight: 700;
        color: #12172B;
        margin-bottom: 12px;
    }
    .error-message {
        font-size: 1rem;
        color: #8B8477;
        margin-bottom: 24px;
        line-height: 1.6;
    }
    .error-icon {
        font-size: 3rem;
        margin-bottom: 20px;
    }
    .btn-back {
        display: inline-block;
        padding: 12px 24px;
        background: #2F6F5E;
        color: white;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        transition: background 0.2s;
    }
    .btn-back:hover {
        background: #275C4E;
    }
</style>

<div class="error-container">
    <div class="error-card">
        <div class="error-icon">🔍</div>
        <div class="error-code">404</div>
        <div class="error-title">Page Not Found</div>
        <div class="error-message">
            The requested page does not exist. Please check the URL and try again, or use the navigation menu.
        </div>
        <a href="{{ url_for('dashboard') if session.get('user_id') else url_for('login_page') }}" class="btn-back">
            ← Go Back
        </a>
    </div>
</div>

{% endblock %}
